name: Build and Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build executable
      run: |
        python -m PyInstaller --onefile --windowed --name "AutoClicker" --exclude-module PyQt5 auto_clicker.py
        
    - name: Copy qt.conf to dist
      run: |
        Copy-Item "qt.conf" "dist\"
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: AutoClicker-Windows
        path: |
          dist/AutoClicker.exe
          dist/qt.conf
          
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/AutoClicker.exe
          dist/qt.conf
        body: |
          ## 🖱️ AutoClicker Release ${{ github.ref_name }}
          
          ### 📥 Download Instructions
          1. Download **both files**: `AutoClicker.exe` and `qt.conf`
          2. Place them in the same folder
          3. Double-click `AutoClicker.exe` to run
          4. **No Python installation required!** ✨
          
          ### ⚠️ Important Notes
          - Some antivirus software may flag the executable (false positive)
          - May require administrator privileges for global hotkey (F6)
          - Both files must be in the same folder
          
          ### 🎯 Features
          - Smart clicking (cursor or fixed position)
          - Customizable intervals (1ms to 10s)
          - All mouse buttons (Left/Right/Middle)
          - Multi-click support (Single/Double/Triple)
          - Global hotkey (F6) works anywhere
          - Modern, intuitive interface
          
          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for detailed changes.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Test import
      run: |
        python -c "import sys; sys.path.append('.'); from auto_clicker import AutoClickerApp; print('✅ Import successful')"
        
    - name: Syntax check
      run: |
        python -m py_compile auto_clicker.py
        echo "✅ Syntax check passed"